spring.application.name=personal-finance-manager
server.port=${PORT:8080}

# PostgreSQL only: no H2 dependency, URL, profile, or fallback.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/syfe_finance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# For a real deployment, prefer managed schema migrations over ddl-auto=update.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Session-cookie authentication
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
